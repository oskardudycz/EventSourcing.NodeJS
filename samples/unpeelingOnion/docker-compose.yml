name: eventsourcing

services:
  #######################################################
  #  MongoDB
  #######################################################
  mongodb:
    profiles: [ mongodb, mongodb-all, all, all-no-ui, ci, sample ]
    image: mongo:9.0.8
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      # initialises the single-node replica set on the first check
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 100
    networks:
      - mongodb

networks:
  mongodb:
    driver: bridge

volumes:
  mongodb-data:
