name: eventsourcing

services:
  #######################################################
  #  KurrentDB
  #######################################################
  kurrentdb:
    profiles: [ kurrentdb, kurrentdb-all, all, all-no-ui, ci, sample ]
    image: ${KURRENTDB_IMAGE:-kurrentplatform/kurrentdb:26.2.3}
    # on ARM (e.g. Apple Silicon) run: KURRENTDB_IMAGE=kurrentplatform/kurrentdb:26.2.3-experimental-arm64-10.0-noble docker compose --profile all up
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_NODE_PORT=2113
      - KURRENTDB_INSECURE=true
      - KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - '${KURRENTDB_PORT:-2113}:2113'
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
      - kurrentdb-logs:/var/log/kurrentdb
    networks:
      - kurrentdb

  #######################################################
  #  MongoDB
  #######################################################
  mongodb:
    profiles: [ mongodb, mongodb-all, all, all-no-ui, ci, sample ]
    image: mongo:9.0.8
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      # initialises the single-node replica set on the first check
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 100
    networks:
      - mongodb

  mongo-express:
    profiles: [ mongodb-ui, mongodb-all, all ]
    image: mongo-express:1.0.2
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '${MONGO_EXPRESS_PORT:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: 'false'
    networks:
      - mongodb

networks:
  kurrentdb:
    driver: bridge
  mongodb:
    driver: bridge

volumes:
  kurrentdb-data:
  kurrentdb-logs:
  mongodb-data:
