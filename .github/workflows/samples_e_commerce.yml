name: Samples - E-commerce

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
    paths:
      - "samples/e-commerce/**"
      - ".github/workflows/samples_e_commerce.yml"
  # run it during pull request
  pull_request:
    paths:
      - "samples/e-commerce/**"
      - ".github/workflows/samples_e_commerce.yml"

defaults:
  run:
    # relative path to the place where source code (with package.json) is located
    working-directory: samples/e-commerce

jobs:
  build-and-test-code:
    name: Build application code
    # use system defined below in the tests matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # define the test matrix
      matrix:
        # selected operation systems to run CI
        os: [ubuntu-latest] #, windows-latest, macos-latest]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./samples/e-commerce/.nvmrc
          cache: "npm"
          cache-dependency-path: "./samples/e-commerce/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run linting (ESlint and Prettier)
        run: npm run lint

      - name: Build
        run: npm run build:ts

      - name: Run tests
        run: npm test
