name: Samples - Foundations

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
    paths:
      - "samples/foundations/**"
  # run it during pull request
  pull_request:
    paths:
      - "samples/foundations/**"

defaults:
  run:
    # relative path to the place where source code (with package.json) is located
    working-directory: samples/foundations

jobs:
  build-and-test-code:
    name: Build and test application code
    # use system defined below in the tests matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # define the test matrix
      matrix:
        # selected operation systems to run CI
        os: [ubuntu-latest] #, windows-latest, macos-latest]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./samples/foundations/.nvmrc
          cache: "npm"
          cache-dependency-path: "./samples/foundations/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run linting (ESlint and Prettier)
        run: npm run lint

      - name: Build
        run: npm run build:ts

      - name: Test
        run: npm test
